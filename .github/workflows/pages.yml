# Publishes web/ (index.html + anonymised seed_data.js) as the GitHub Pages demo.
# Repo settings → Pages → Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/make_demo_seed.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The demo seed is public: refuse to deploy if real ride times ever get back in.
      - name: Verify demo seed is anonymised
        run: PYTHONPATH=. python3 scripts/make_demo_seed.py --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
